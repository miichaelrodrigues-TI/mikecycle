<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MikeCycle</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #0d0602;
    --surface: #160b03;
    --surface2: #1f1005;
    --border: #3a1f08;
    --accent: #E79022;
    --accent2: #DF621C;
    --warn: #DF621C;
    --text: #f5e6d0;
    --text-muted: #9a7050;
    --text-dim: #7a5535;
    --checked: #3a1f05;
    --checked-border: #E79022;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(231,144,34,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(231,144,34,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    position: relative;
    z-index: 1;
  }

  /* ── LOGIN SCREEN ───────────────────────────────────── */
  #loginScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 32px;
  }

  .login-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .login-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .login-title {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  .login-title span { color: var(--accent); }

  .login-sub {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .btn-google {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    color: #1a1a1a;
    border: none;
    border-radius: var(--radius-sm);
    padding: 14px 28px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  .btn-google:hover { background: #f0f0f0; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

  .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* ── LOADING ─────────────────────────────────────────── */
  #loadingScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 99;
    gap: 16px;
  }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-label {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }

  /* ── APP ─────────────────────────────────────────────── */
  #appScreen { display: none; }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .logo { display: flex; flex-direction: column; }

  .logo-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }

  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  .user-info {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .user-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--accent);
  }

  .user-name {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .btn-logout {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }
  .btn-logout:hover { border-color: var(--warn); color: var(--warn); }

  .current-day { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent2); letter-spacing: 0.05em; }
  .date-display { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-family: 'DM Mono', monospace; }

  /* Sync status */
  .sync-status {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sync-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
  }

  .sync-dot.syncing { background: #fbbf24; animation: pulse 1s infinite; }
  .sync-dot.synced  { background: var(--accent); }
  .sync-dot.error   { background: var(--warn); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Progress */
  .global-progress {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .progress-label { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; letter-spacing: 0.08em; white-space: nowrap; }
  .progress-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width 0.5s ease; }
  .progress-pct { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--accent); white-space: nowrap; min-width: 40px; text-align: right; }

  /* Main nav */
  .main-nav {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
    width: fit-content;
  }

  .main-tab {
    padding: 8px 22px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.2s;
    letter-spacing: 0.04em;
    border: none;
    background: none;
    font-family: 'Syne', sans-serif;
  }

  .main-tab.active {
    background: linear-gradient(135deg, rgba(0,229,160,0.15), rgba(0,153,255,0.1));
    color: var(--accent);
  }

  /* Day tabs */
  .day-tabs { display: flex; gap: 8px; margin-bottom: 28px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .day-tabs::-webkit-scrollbar { display: none; }

  .day-tab {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 72px;
  }

  .day-tab .day-name { font-size: 12px; letter-spacing: 0.05em; }
  .day-tab .day-dots { display: flex; gap: 3px; }
  .day-tab .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); }
  .day-tab:hover { border-color: var(--accent2); color: var(--text); }
  .day-tab.active { background: linear-gradient(135deg, rgba(0,229,160,0.12), rgba(0,153,255,0.08)); border-color: var(--accent); color: var(--accent); }
  .day-tab.today { position: relative; }
  .day-tab.today::after { content: '●'; position: absolute; top: -6px; right: -6px; font-size: 8px; color: var(--accent); }
  .day-tab.treino { border-bottom: 2px solid var(--warn); }
  .day-tab.plus { border-bottom: 2px dashed var(--accent2); }
  .day-tab.plus .day-name::after { content: " +"; font-size: 10px; color: var(--accent2); }
  .day-tab.cardio-done { position: relative; }
  .day-tab.cardio-done::before { content: '🏃'; position: absolute; top: -8px; left: -4px; font-size: 10px; }
  .day-tab.treino .day-name::after { content: " ⚡"; font-size: 10px; }

  .day-panel { display: none; }
  .day-panel.active { display: block; animation: fadeSlide 0.25s ease; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .day-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .day-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .day-count { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; }

  .med-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }

  .med-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .med-item:hover { border-color: rgba(0,229,160,0.3); background: var(--surface2); }
  .med-item.checked { background: var(--checked); border-color: var(--checked-border); opacity: 0.75; }

  .med-checkbox {
    width: 20px; height: 20px;
    border: 2px solid var(--text-muted);
    border-radius: 5px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .med-item.checked .med-checkbox { background: var(--accent); border-color: var(--accent); }
  .med-checkbox svg { display: none; }
  .med-item.checked .med-checkbox svg { display: block; }

  .med-info { flex: 1; }
  .med-name { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  .med-item.checked .med-name { text-decoration: line-through; color: var(--text-muted); }
  .med-detail { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); margin-top: 3px; letter-spacing: 0.05em; }

  .med-tag { font-family: 'DM Mono', monospace; font-size: 10px; padding: 3px 8px; border-radius: 4px; border: 1px solid; white-space: nowrap; flex-shrink: 0; }
  .tag-treino   { color: var(--warn); border-color: rgba(255,107,53,0.4); background: rgba(255,107,53,0.08); }
  .tag-noite    { color: #a78bfa; border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); }
  .tag-manha    { color: #fbbf24; border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.08); }
  .tag-cafe     { color: var(--accent2); border-color: rgba(0,153,255,0.4); background: rgba(0,153,255,0.08); }
  .tag-standard { color: var(--text-muted); border-color: var(--border); background: transparent; }

  .delete-btn {
    width: 28px; height: 28px; border: none; background: none;
    color: var(--text-muted); cursor: pointer; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.15s; flex-shrink: 0; opacity: 0;
  }
  .med-item:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { background: rgba(255,80,80,0.15); color: #ff5050; }

  .expand-btn {
    width: 24px; height: 24px; border: none; background: none;
    color: var(--text-muted); cursor: pointer; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: all 0.2s; flex-shrink: 0;
  }
  .expand-btn:hover { color: var(--accent2); }
  .expand-btn.open { transform: rotate(180deg); color: var(--accent2); }

  .med-description {
    display: none;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.7;
    padding: 10px 14px;
    margin: 0 18px 14px;
    background: var(--surface2);
    border-left: 2px solid var(--accent2);
    border-radius: 0 6px 6px 0;
    animation: fadeSlide 0.2s ease;
  }
  .med-description.open { display: block; }




  /* ── REMÉDIOS SECTION ────────────────────────────────── */
  .med-section { margin-bottom: 24px; }

  .med-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .med-toggle:hover { border-color: rgba(0,229,160,0.4); }
  .med-toggle.open { border-radius: var(--radius) var(--radius) 0 0; border-color: rgba(0,229,160,0.5); }

  .med-toggle-left { display: flex; align-items: center; gap: 12px; }
  .med-toggle-icon {
    width: 32px; height: 32px;
    background: rgba(0,229,160,0.1);
    border: 1px solid rgba(0,229,160,0.3);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .med-toggle-info { display: flex; flex-direction: column; gap: 2px; }
  .med-toggle-title { font-size: 15px; font-weight: 700; }
  .med-toggle-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted); }
  .med-chevron { font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
  .med-toggle.open .med-chevron { transform: rotate(180deg); }

  .med-body {
    display: none;
    background: var(--surface);
    border: 1px solid rgba(0,229,160,0.5);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 16px 18px;
  }
  .med-body.open { display: block; animation: fadeSlide 0.2s ease; }

  /* ── TREINO ──────────────────────────────────────────── */
  .treino-section { margin-bottom: 24px; }

  .treino-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .treino-toggle:hover { border-color: rgba(255,107,53,0.4); }
  .treino-toggle.open { border-radius: var(--radius) var(--radius) 0 0; border-color: rgba(255,107,53,0.5); }

  .treino-toggle-left { display: flex; align-items: center; gap: 12px; }
  .treino-toggle-icon {
    width: 32px; height: 32px;
    background: rgba(255,107,53,0.1);
    border: 1px solid rgba(255,107,53,0.3);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .treino-toggle-info { display: flex; flex-direction: column; gap: 2px; }
  .treino-toggle-title { font-size: 15px; font-weight: 700; }
  .treino-toggle-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted); }
  .treino-chevron { font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
  .treino-toggle.open .treino-chevron { transform: rotate(180deg); }

  .treino-body {
    display: none;
    background: var(--surface);
    border: 1px solid rgba(255,107,53,0.5);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 16px 18px;
  }
  .treino-body.open { display: block; animation: fadeSlide 0.2s ease; }

  /* Nome do treino */
  .treino-nome-wrap {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .treino-nome-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s;
  }
  .treino-nome-input:focus { border-color: var(--warn); }

  .btn-save-nome {
    background: var(--warn); color: #fff; border: none;
    border-radius: var(--radius-sm); padding: 9px 14px;
    font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .btn-save-nome:hover { opacity: 0.85; }

  /* Lista exercícios */
  .ex-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

  .ex-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: all 0.2s; user-select: none;
  }
  .ex-item:hover { border-color: rgba(255,107,53,0.3); }
  .ex-item.done { background: rgba(255,107,53,0.06); border-color: rgba(255,107,53,0.4); opacity: 0.8; }

  .ex-chk {
    width: 18px; height: 18px;
    border: 2px solid var(--text-muted);
    border-radius: 4px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .ex-item.done .ex-chk { background: var(--warn); border-color: var(--warn); }
  .ex-chk svg { display: none; }
  .ex-item.done .ex-chk svg { display: block; }

  .ex-info { flex: 1; }
  .ex-name { font-size: 13px; font-weight: 600; }
  .ex-item.done .ex-name { text-decoration: line-through; color: var(--text-muted); }
  .ex-badges { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .ex-badge {
    font-family: 'DM Mono', monospace; font-size: 10px;
    padding: 2px 7px; border-radius: 4px; border: 1px solid;
  }
  .ex-badge.series { color: var(--warn); border-color: rgba(255,107,53,0.4); background: rgba(255,107,53,0.06); }
  .ex-badge.carga  { color: #fbbf24; border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.06); }

  .ex-del { width:24px; height:24px; border:none; background:none; color:var(--text-muted); cursor:pointer; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:14px; opacity:0; transition:all 0.15s; flex-shrink:0; }
  .ex-item:hover .ex-del { opacity:1; }
  .ex-del:hover { background:rgba(255,80,80,0.15); color:#ff5050; }

  /* Progresso treino */
  .ex-progress { display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .ex-progress-bar { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .ex-progress-fill { height:100%; background:var(--warn); border-radius:2px; transition:width 0.4s ease; }
  .ex-progress-pct { font-family:'DM Mono',monospace; font-size:10px; color:var(--warn); min-width:36px; text-align:right; }

  /* Add exercício */
  .add-ex-section {
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .add-ex-section:focus-within { border-color: var(--warn); border-style: solid; }

  .add-ex-title { font-family:'DM Mono',monospace; font-size:10px; color:var(--text-muted); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:10px; }

  .add-ex-form { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; align-items:end; }
  @media(max-width:600px){ .add-ex-form { grid-template-columns:1fr 1fr; } .add-ex-btn { grid-column:span 2; } }

  .add-ex-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .add-ex-input:focus { border-color: var(--warn); }

  .add-ex-btn {
    background: var(--warn); color: #fff; border: none;
    border-radius: var(--radius-sm); padding: 8px 14px;
    font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; white-space: nowrap; height: 36px;
  }
  .add-ex-btn:hover { opacity: 0.85; transform: translateY(-1px); }

  /* Observações */
  .treino-obs-wrap { margin-top: 4px; }

    font-size: 11px;
    line-height: 1.7;

    margin-bottom: 16px;

    align-items: center;
    gap: 16px;

  .crono-display {

    font-size: 28px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.05em;
    min-width: 90px;
  }

  .crono-display.running { color: var(--accent); }
  .crono-display.warning { color: #fbbf24; }
  .crono-display.danger  { color: var(--warn); animation: pulse 0.8s infinite; }

  .crono-btns { display: flex; gap: 8px; margin-left: auto; }

    font-size: 11px;

    border: 1px solid var(--border);

  .cardio-checkbox {
    width: 20px; height: 20px;

    font-size: 13px;
    font-weight: 600;

  .treino-header-left { display: flex; align-items: center; gap: 12px; }

  .treino-icon {

  .treino-chevron {
    font-size: 12px;
    color: var(--text-muted);

    display: none;

  .history-list { display: flex; flex-direction: column; gap: 16px; }

  .history-card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; cursor: pointer; transition: background 0.2s; }

  .history-card-body { display: none; padding: 0 20px 20px; border-top: 1px solid var(--border); }
  .history-card-body.open { display: block; }
  .history-day-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .history-day-row:last-child { border-bottom: none; }
  .hdr-day { font-size: 13px; font-weight: 600; min-width: 80px; }
  .hdr-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .hdr-bar-fill { height: 100%; border-radius: 3px; }
  .hdr-pct { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); min-width: 38px; text-align: right; }
  .delete-history-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 4px 8px; border-radius: 4px; transition: all 0.15s; font-family: 'DM Mono', monospace; letter-spacing: 0.05em; margin-top: 14px; }

  .empty-history { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-muted); text-align: center; padding: 40px 0; line-height: 2; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2); border: 1px solid var(--accent); border-radius: var(--radius-sm);
    padding: 12px 20px; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent);
    z-index: 999; transform: translateY(60px); opacity: 0; transition: all 0.3s ease; letter-spacing: 0.05em;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

</style>
</head>

        if (!state.days[d]) {
          state.days[d] = (INITIAL[d]||[]).map((m,i)=>({
            id:`${d}-${i}-${Date.now()}`, name:m.name, detail:m.detail, tag:m.tag, checked:false
          }));
        }
      });
    } else {
      // First time: create from INITIAL
      state = { days:{}, weekStart: getWeekStart() };
      DAYS.forEach(d => {
        state.days[d] = (INITIAL[d]||[]).map((m,i)=>({
          id:`${d}-${i}-${Date.now()}`, name:m.name, detail:m.detail, tag:m.tag, checked:false
        }));
      });
      await saveToFirestore();
    }

    // Load history
    const hSnap = await getDocs(historyRef());
    history = [];
    hSnap.forEach(d => history.push({ firestoreId: d.id, ...d.data() }));
    history.sort((a,b) => a.weekStart > b.weekStart ? 1 : -1);

    // Pré-carregar fichas nos dias definidos
    const FICHAS_DIAS = {
      'Sábado':  'Ombro + Tríceps',
      'Domingo': 'Costas + Abdômen',
      'Segunda': 'Ombro + Tríceps',
    };
    if (!state.treino) state.treino = {};
    Object.entries(FICHAS_DIAS).forEach(([day, ficha]) => {
      if (!state.treino[day]) {
        state.treino[day] = { nome: ficha, exercicios: [], obs: '' };
      }
      if (!state.treino[day].nome) state.treino[day].nome = ficha;
      if (state.treino[day].exercicios.length === 0 && FICHAS[ficha]) {
        state.treino[day].exercicios = FICHAS[ficha].exercicios.map(ex => ({
          nome: ex.nome, series: ex.series, carga: ex.carga, done: false
        }));
        state.treino[day].obs = FICHAS[ficha].obs || '';
      }
    });
    setSyncStatus('synced', 'Sincronizado');
  } catch(e) {
    setSyncStatus('error', 'Erro de sync');
    console.error(e);
  }
  showLoading(false);
}

function buildAdherenceMap(days) {
  const map={};
  DAYS.forEach(day=>{
    (days[day]||[]).forEach(item=>{
      if(!map[item.name]) map[item.name]={done:0,total:0};

      if(item.checked) map[item.name].done++;
    });
  });

}

// ── Cronômetro (regressivo 60s) ───────────────────────────
const CRONO_START = 60;
const cronoState = {};

function cronoUpdate(day) {
  const s  = cronoState[day];
  const el = document.getElementById(`crono-display-${day}`);
  const btn = document.getElementById(`crono-start-${day}`);
  if (!el) { clearInterval(s.interval); s.running = false; return; }

  const remaining = CRONO_START - s.seconds;
  const m   = String(Math.floor(Math.abs(remaining) / 60)).padStart(2, '0');
  const sec = String(Math.abs(remaining) % 60).padStart(2, '0');
  el.textContent = remaining >= 0 ? `${m}:${sec}` : `-${m}:${sec}`;

  if (remaining <= 0)      el.className = 'crono-display danger';
  else if (remaining <= 15) el.className = 'crono-display warning';
  else                      el.className = 'crono-display running';

  if (remaining === 0) {
    showToast('⏱ Descanso concluído!');
  }
}

window.cronoToggle = function(day) {
  if (!cronoState[day]) cronoState[day] = { seconds: 0, running: false, interval: null };
  const s = cronoState[day];

  if (s.running) {
    clearInterval(s.interval);
    s.running = false;
    const btn = document.getElementById(`crono-start-${day}`);
    if (btn) { btn.textContent = '▶ Continuar'; btn.className = 'crono-btn start'; }
  } else {
    s.running = true;
    const btn = document.getElementById(`crono-start-${day}`);
    if (btn) { btn.textContent = '⏸ Pausar'; btn.className = 'crono-btn pause'; }
    s.interval = setInterval(() => {
      s.seconds++;
      cronoUpdate(day);
    }, 1000);
  }
};

window.cronoReset = function(day) {
  if (cronoState[day]) {
    clearInterval(cronoState[day].interval);
    cronoState[day] = { seconds: 0, running: false, interval: null };
  }
  const el  = document.getElementById(`crono-display-${day}`);
  const btn = document.getElementById(`crono-start-${day}`);
  if (el)  { el.textContent = '01:00'; el.className = 'crono-display'; }
  if (btn) { btn.textContent = '▶ Iniciar'; btn.className = 'crono-btn start'; }
};

      <div class="adh-doses">${done}/${total}×</div>
    </div>`;
  }).join('') : `<div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--text-muted);">Nenhum dado ainda.</div>`;

  // Histórico
  const hEl = document.getElementById('historyList');
  if (!history.length) {
    hEl.innerHTML=`<div class="empty-history">Nenhuma semana fechada ainda.<br>Use "Fechar semana atual" ao final de cada semana.</div>`;
    return;
  }

  hEl.innerHTML = [...history].reverse().map((week, revIdx)=>{
    const idx   = history.length-1-revIdx;
    const total = DAYS.reduce((s,d)=>s+(week.days[d]||[]).length,0);
    const done  = DAYS.reduce((s,d)=>s+(week.days[d]||[]).filter(x=>x.checked).length,0);
    const pct   = total?Math.round((done/total)*100):0;
    const color = pctColor(pct);

    const dayRows = DAYS.map(day=>{
      const items=(week.days[day]||[]), d2=items.filter(x=>x.checked).length, t2=items.length;
      const p=t2?Math.round((d2/t2)*100):0;
      return `<div class="history-day-row">
        <div class="hdr-day">${day}</div>
        <div class="hdr-bar-wrap"><div class="hdr-bar-fill" style="width:${p}%;background:${pctColor(p)}"></div></div>
        <div class="hdr-pct">${p}%</div>
      </div>`;
    }).join('');

    const medMap  = buildAdherenceMap(week.days);
    const medRows = Object.entries(medMap).sort((a,b)=>{
      const pa=a[1].total?a[1].done/a[1].total:0, pb=b[1].total?b[1].done/b[1].total:0; return pa-pb;
    }).map(([name,{done:d2,total:t2}])=>{
      const p=t2?Math.round((d2/t2)*100):0, c=pctColor(p);
      return `<div class="med-adherence-item" style="margin-top:10px;">
        <div class="adh-name">${name}</div>
        <div class="adh-bar-wrap"><div class="adh-bar-fill" style="width:${p}%;background:${c}"></div></div>
        <div class="adh-pct" style="color:${c}">${p}%</div>
        <div class="adh-doses">${d2}/${t2}×</div>
      </div>`;
    }).join('');

    return `<div class="history-card">
      <div class="history-card-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <div>
          <div class="history-week-label">Semana ${idx+1} — ${formatDate(week.weekStart)} → ${formatDate(week.weekEnd)}</div>
          <div class="history-week-meta">${done}/${total} doses registradas</div>
        </div>
        <div class="history-pct-badge" style="color:${color}">${pct}%</div>
      </div>
      <div class="history-card-body">
        <div style="margin-top:16px;">
          <div class="rel-section-label" style="margin-bottom:8px;">Por dia</div>
          ${dayRows}
        </div>
        <div style="margin-top:20px;">
          <div class="rel-section-label" style="margin-bottom:4px;">Por remédio</div>
          ${medRows}
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <button class="delete-history-btn" onclick="deleteHistory('${week.firestoreId}')">🗑 Apagar esta semana</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.deleteHistory = async function(firestoreId) {
  if (!confirm('Apagar esta semana do histórico?')) return;
  try {
    await deleteDoc(doc(db, 'users', uid, 'history', firestoreId));
    history = history.filter(w => w.firestoreId !== firestoreId);
    renderRelatorio();
    showToast('Semana removida');
  } catch(e) {
    showToast('Erro ao apagar');
  }
};

// ── Close week ────────────────────────────────────────────
window.closeWeek = async function() {
  const total = DAYS.reduce((s,d)=>s+(state.days[d]||[]).length,0);
  if (!total) { showToast('Nenhum remédio cadastrado'); return; }

  const weekData = {
    weekStart : state.weekStart,
    weekEnd   : new Date().toISOString().slice(0,10),
    closedAt  : new Date().toISOString(),
    days      : JSON.parse(JSON.stringify(state.days)),
  };

  try {
    const ref = await addDoc(historyRef(), weekData);
    history.push({ firestoreId: ref.id, ...weekData });
    DAYS.forEach(d => state.days[d].forEach(x => x.checked = false));
    state.weekStart = getWeekStart();
    await saveToFirestore();
    render();
    renderRelatorio();
    showToast('✓ Semana fechada e salva na nuvem!');
  } catch(e) {
    showToast('Erro ao fechar semana');
    console.error(e);
  }
};

// ── Render agenda ─────────────────────────────────────────
function render() {
  if (!state) return;
  renderTabs();
  renderPanels();
  updateGlobalProgress();
  updateHeader();
}

function renderTabs() {
  const el = document.getElementById('dayTabs');
  el.innerHTML='';
  DAYS.forEach((day,idx)=>{
    const items=state.days[day]||[], done=items.filter(x=>x.checked).length;
    const tab=document.createElement('div');
    


const PLUS_DAYS = ['Terça','Quarta','Quinta'];
    const isTreino = (state.days[day]||[]).some(x => x.tag === 'treino');
    const isPlus = !isTreino && PLUS_DAYS.includes(day);
    const cardioFeito = state.cardio && state.cardio[day];
    tab.className='day-tab'+(day===activeDay?' active':'')+(idx===todayIndex?' today':'')+(isTreino?' treino':'')+(isPlus?' plus':'')+(cardioFeito?' cardio-done':'');
    const dots=items.slice(0,5).map(i=>`<div class="dot" style="${i.checked?'background:var(--accent)':''}"></div>`).join('');
    tab.innerHTML=`<span class="day-name">${day.substring(0,3).toUpperCase()}</span><div class="day-dots">${dots||'<div class="dot"></div>'}</div>`;
    tab.title=`${done}/${items.length} concluídos`;
    tab.addEventListener('click',()=>{ activeDay=day; render(); });
    el.appendChild(tab);
  });
}

function renderPanels() {
  const container=document.getElementById('dayPanels');
  container.innerHTML='';
  DAYS.forEach(day=>{
    const panel=document.createElement('div');
    panel.className='day-panel'+(day===activeDay?' active':'');
    const items=state.days[day]||[], done=items.filter(x=>x.checked).length;

    panel.innerHTML=`
      <div class="day-header">
        <div class="day-title">${day}</div>
        <div class="day-count">${done} / ${items.length} tomados</div>
      </div>
      <div class="med-section" id="med-sec-${day}"></div>
      <div class="treino-section" id="treino-sec-${day}"></div>
      <div class="day-actions"><button class="btn-reset" onclick="resetDay('${day}')">↺ Resetar dia</button></div>`;

    container.appendChild(panel);
    renderMedSection(day);
    renderTreinoDay(day);
  });
}

function renderCardioSummary() {
  const el = document.getElementById('cardioWeekSummary');
  if (!el) return;
  const cardio = state.cardio || {};
  const total = DAYS.length;
  const done  = DAYS.filter(d => cardio[d]).length;
  const pct   = Math.round((done / total) * 100);
  const color = done >= 5 ? 'var(--accent)' : done >= 3 ? '#fbbf24' : 'var(--warn)';

  const dayDots = DAYS.map(d => {
    const feito = cardio[d];
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <div style="width:32px;height:32px;border-radius:50%;border:2px solid ${feito ? 'var(--accent2)' : 'var(--border)'};background:${feito ? 'rgba(0,153,255,0.15)' : 'transparent'};display:flex;align-items:center;justify-content:center;font-size:14px;">
        ${feito ? '🏃' : ''}
      </div>
      <span style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text-muted);">${d.substring(0,3).toUpperCase()}</span>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px;">
      <div style="font-family:'DM Mono',monospace;font-size:36px;font-weight:700;color:${color};">${done}<span style="font-size:16px;color:var(--text-muted);">/${total}</span></div>
      <div>
        <div style="font-size:14px;font-weight:600;">dias com cardio</div>
        <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);margin-top:2px;">${pct}% da semana</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:space-between;">${dayDots}</div>
  `;
}

window.toggleCardio = function(day) {
  if (!state.cardio) state.cardio = {};
  state.cardio[day] = !state.cardio[day];
  saveState();
  renderTreinoDay(day);
  renderTabs();
  if (currentView === 'relatorio') renderCardioSummary();
  showToast(state.cardio[day] ? '🏃 Cardio registrado!' : 'Cardio desmarcado');
};

window.toggleDesc = function(btn, e) {
  e.stopPropagation();
  const descEl = btn.closest(".med-item").nextElementSibling;
  if (!descEl) return;
  descEl.classList.toggle("open");
  btn.classList.toggle("open");
};

window.toggleItem = async function(day, id) {
  const item=state.days[day].find(x=>x.id===id);
  if(!item) return;
  item.checked=!item.checked;
  renderMedSection(day);
  renderTabs();
  updateGlobalProgress();
  await saveToFirestore();
  if(item.checked) showToast(`✓ ${item.name} marcado`);
};

window.removeItem = async function(day, id, e) {
  e.stopPropagation();
  state.days[day]=state.days[day].filter(x=>x.id!==id);
  renderMedSection(day);
  renderTabs();
  updateGlobalProgress();
  await saveToFirestore();
  showToast('Remédio removido');
};

window.addItem = async function(day) {
  const nEl=document.getElementById(`inp-name-${day}`), dEl=document.getElementById(`inp-detail-${day}`), tEl=document.getElementById(`inp-tag-${day}`);
  const name=nEl.value.trim();
  if(!name){ nEl.focus(); return; }
  state.days[day].push({ id:`${day}-${Date.now()}`, name, detail:dEl.value.trim(), tag:tEl.value, checked:false });
  nEl.value=''; dEl.value=''; tEl.value='standard';
  renderMedSection(day);
  renderTabs();
  updateGlobalProgress();
  await saveToFirestore();
  showToast(`+ ${name} adicionado`);
};

window.resetDay = async function(day) {
  state.days[day].forEach(x=>x.checked=false);
  render();
  await saveToFirestore();
  showToast('Dia resetado');
};

function updateGlobalProgress() {
  let total=0,done=0;
  DAYS.forEach(d=>{ const items=state.days[d]||[]; total+=items.length; done+=items.filter(x=>x.checked).length; });
  const pct=total?Math.round((done/total)*100):0;
  document.getElementById('globalBar').style.width=pct+'%';
  document.getElementById('globalPct').textContent=pct+'%';
}

function updateHeader() {
  document.getElementById('currentDayLabel').textContent=DAYS[todayIndex].toUpperCase();
  document.getElementById('dateDisplay').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}

let toastTimer;
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.matches('.field-input')) addItem(activeDay); });


</script>
</body>
</html>
