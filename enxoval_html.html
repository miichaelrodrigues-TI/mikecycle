<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enxoval do Oliver</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F5F9F7; min-height: 100vh; color: #1a1a1a; }
  .container { max-width: 640px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

/* Login */
#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-card { background: #fff; border-radius: 16px; padding: 2.5rem 2rem; border: 0.5px solid #d0e8df; text-align: center; max-width: 340px; width: 90%; }
.login-card .icon { font-size: 40px; margin-bottom: 12px; }
.login-card h2 { font-size: 20px; font-weight: 500; color: #085041; margin-bottom: 4px; }
.login-card p { font-size: 13px; color: #5a7a70; margin-bottom: 1.5rem; }
.erro { font-size: 12px; color: #A32D2D; background: #FCEBEB; padding: 8px 12px; border-radius: 8px; margin-bottom: 1rem; display: none; }
.btn-google { width: 100%; padding: 10px 0; border-radius: 10px; border: none; background: #1D9E75; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }

/* Header */
.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
.header-left p { font-size: 13px; color: #5a7a70; margin-bottom: 2px; }
.header-left h1 { font-size: 22px; font-weight: 500; color: #085041; }
.header-right { display: flex; align-items: center; gap: 8px; }
.header-right img { width: 32px; height: 32px; border-radius: 50%; }
.btn-sair { background: none; border: 0.5px solid #c5d9d0; border-radius: 8px; padding: 4px 10px; font-size: 12px; color: #5a7a70; cursor: pointer; font-family: inherit; }

/* Alertas */
.alerta { border-radius: 12px; padding: 12px 16px; margin-bottom: 1rem; }
.alerta p { margin: 2px 0; font-size: 13px; }
.alerta .titulo { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.alerta-hoje { background: #E1F5EE; border: 0.5px solid #1D9E75; }
.alerta-hoje .titulo, .alerta-hoje p { color: #085041; }
.alerta-amanha { background: #FEF3C7; border: 0.5px solid #EF9F27; }
.alerta-amanha .titulo, .alerta-amanha p { color: #633806; }

/* Métricas */
.metricas { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-bottom: 1.25rem; }
.metrica { background: #fff; border-radius: 10px; padding: 12px 14px; border: 0.5px solid #d0e8df; }
.metrica .lbl { font-size: 13px; color: #5a7a70; margin-bottom: 6px; }
.metrica .val { font-size: 20px; font-weight: 500; color: #085041; margin-bottom: 2px; }
.metrica .sub { font-size: 13px; color: #5a7a70; }

/* Barra */
.barra-wrap { height: 6px; border-radius: 99px; background: #d0e8df; overflow: hidden; margin-bottom: 1.5rem; }
.barra-fill { height: 100%; background: #1D9E75; border-radius: 99px; transition: width 0.4s ease; }

/* Filtros */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.filtros2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 1.25rem; }
.filtro-btn { display: flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 99px; font-size: 14px; cursor: pointer; background: transparent; color: #5a7a70; border: 0.5px solid #c5d9d0; font-family: inherit; }
.filtro-btn.ativo { background: #fff; color: #085041; border-color: #1D9E75; font-weight: 500; }
.filtro-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

/* Lista */
.lista { display: flex; flex-direction: column; }
.item-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; }
.item-sep { height: 0.5px; background: #d0e8df; }
.status-btns { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.status-btn { padding: 3px 8px; border-radius: 99px; font-size: 11px; cursor: pointer; white-space: nowrap; font-family: inherit; }
.item-info { flex: 1; min-width: 0; }
.item-nome { font-size: 16px; font-weight: 500; color: #1a1a1a; margin: 0 0 4px; }
.item-nome.riscado { color: #5a7a70; text-decoration: line-through; }
.item-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.item-tag { font-size: 13px; padding: 2px 10px; border-radius: 99px; }
.item-acoes { display: flex; gap: 2px; flex-shrink: 0; }
.btn-acao { background: none; border: none; cursor: pointer; font-size: 15px; padding: 4px 6px; }

/* Edição */
.edit-box { margin-bottom: 8px; padding: 14px; background: #f0f7f4; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.edit-box label { font-size: 12px; color: #5a7a70; display: block; margin-bottom: 4px; }
.edit-box input, .edit-box select { padding: 6px 10px; border-radius: 8px; border: 0.5px solid #c5d9d0; background: #fff; color: #1a1a1a; font-size: 14px; width: 100%; font-family: inherit; }
.edit-full { grid-column: 1 / -1; }
.btn-salvar { grid-column: 1 / -1; padding: 7px 0; border-radius: 8px; border: 0.5px solid #1D9E75; background: #E1F5EE; color: #085041; font-weight: 500; font-size: 13px; cursor: pointer; font-family: inherit; }

/* Adicionar */
.btn-adicionar { width: 100%; padding: 10px 0; border-radius: 10px; border: 0.5px dashed #a0c4b8; background: transparent; color: #5a7a70; font-size: 14px; cursor: pointer; margin-top: 1rem; font-family: inherit; }
.add-box { margin-top: 1rem; background: #fff; border-radius: 10px; padding: 14px; border: 0.5px solid #d0e8df; display: flex; flex-direction: column; gap: 10px; }
.add-box label { font-size: 12px; color: #5a7a70; display: block; margin-bottom: 4px; }
.add-box input, .add-box select { padding: 6px 10px; border-radius: 8px; border: 0.5px solid #c5d9d0; background: #fff; color: #1a1a1a; font-size: 14px; width: 100%; font-family: inherit; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.add-acoes { display: flex; gap: 8px; }
.btn-confirmar { flex: 1; padding: 9px 0; border-radius: 8px; border: none; background: #1D9E75; color: #fff; font-weight: 500; font-size: 14px; cursor: pointer; font-family: inherit; }
.btn-confirmar:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-cancelar { padding: 9px 16px; border-radius: 8px; border: 0.5px solid #c5d9d0; background: transparent; color: #5a7a70; font-size: 14px; cursor: pointer; font-family: inherit; }
.rodape { text-align: center; font-size: 12px; color: #5a7a70; margin-top: 1.5rem; }
#app { display: none; }
</style>

</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ─── CONFIGURAÇÃO ───────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyADUAqt09VqHHvDspQydlEVUZSZmYYL31g",
  authDomain:        "mikecycle-a96e8.firebaseapp.com",
  projectId:         "mikecycle-a96e8",
  storageBucket:     "mikecycle-a96e8.firebasestorage.app",
  messagingSenderId: "53041455968",
  appId:             "1:53041455968:web:7d3bcb2f80c2b3a46d7405",
};

const EMAILS_PERMITIDOS = [
  "miichaelrodrigues@gmail.com",
  "camilacorrea.to@gmail.com",
];
// ────────────────────────────────────────────

const app      = initializeApp(firebaseConfig);
const auth     = getAuth(app);
const provider = new GoogleAuthProvider();
const db       = getFirestore(app);

const CATEGORIAS = {
  "Roupinhas":            { emoji: "👕", cor: "#E1F5EE", corText: "#085041" },
  "Higiene & Saúde":      { emoji: "🛁", cor: "#E6F1FB", corText: "#0C447C" },
  "Quarto & Berço":       { emoji: "🛏️", cor: "#EEEDFE", corText: "#3C3489" },
  "Alimentação":          { emoji: "🍼", cor: "#FAEEDA", corText: "#633806" },
  "Passeio & Transporte": { emoji: "🚗", cor: "#FAECE7", corText: "#712B13" },
  "Brinquedos & Lazer":   { emoji: "🧸", cor: "#FBEAF0", corText: "#72243E" },
};

const STATUS = {
  falta:  { label: "Falta comprar",      borda: "#E24B4A", bg: "#FCEBEB", textoCor: "#A32D2D" },
  pedido: { label: "Aguardando entrega", borda: "#EF9F27", bg: "#FEF3C7", textoCor: "#633806" },
  temos:  { label: "Já temos",           borda: "#1D9E75", bg: "#1D9E75", textoCor: "#fff"    },
};

const FILTROS_STATUS = [
  ["Todos",  null,      "Todos"],
  ["falta",  "#E24B4A", "Falta comprar"],
  ["pedido", "#EF9F27", "Aguardando entrega"],
  ["temos",  "#1D9E75", "Já temos"],
];

const fmt = v => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const dtMs = str => { const d = new Date(str + "T12:00:00"); d.setHours(0,0,0,0); return d.getTime(); };

let itens = [];
let catAtiva = "Todas";
let filtroStatus = "Todos";
let editandoId = null;
let userNome = "Michael";

// ── AUTH ──────────────────────────────────
window.fazerLogin  = () => signInWithPopup(auth, provider);
window.fazerLogout = () => signOut(auth);

onAuthStateChanged(auth, u => {
  if (u && EMAILS_PERMITIDOS.includes(u.email)) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("user-foto").src = u.photoURL || "";
    document.getElementById("erro-login").style.display = "none";
    userNome = u.displayName ? u.displayName.split(" ")[0] : u.email.split("@")[0];
    iniciarFirestore();
    popularCats();
  } else if (u) {
    signOut(auth);
    document.getElementById("erro-login").style.display = "block";
  } else {
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});

// ── FIRESTORE ─────────────────────────────
function iniciarFirestore() {
  onSnapshot(collection(db, "itens"), snap => {
    itens = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTudo();
  });
}

// ── RENDER ────────────────────────────────
function renderTudo() {
  renderAlertas();
  renderMetricas();
  renderFiltros();
  renderLista();
}

function renderAlertas() {
  const hoje   = new Date(); hoje.setHours(0,0,0,0);
  const amanha = new Date(hoje); amanha.setDate(hoje.getDate() + 1);
  const eHoje   = itens.filter(i => i.status === "pedido" && i.prazoEntrega && dtMs(i.prazoEntrega) === hoje.getTime());
  const eAmanha = itens.filter(i => i.status === "pedido" && i.prazoEntrega && dtMs(i.prazoEntrega) === amanha.getTime());
  let html = "";
  if (eHoje.length)   html += `<div class="alerta alerta-hoje"><p class="titulo">🚚 Chegando hoje!</p>${eHoje.map(i => `<p>· ${i.nome}</p>`).join("")}</div>`;
  if (eAmanha.length) html += `<div class="alerta alerta-amanha"><p class="titulo">📦 Chegando amanhã!</p>${eAmanha.map(i => `<p>· ${i.nome}</p>`).join("")}</div>`;
  document.getElementById("alertas").innerHTML = html;
}

function renderMetricas() {
  const temos    = itens.filter(i => i.status === "temos").length;
  const pedido   = itens.filter(i => i.status === "pedido").length;
  const gasto    = itens.filter(i => i.status === "temos" && !i.presente).reduce((s, i) => s + (i.valor || 0), 0);
  const presentes= itens.filter(i => i.status === "temos" && i.presente).reduce((s, i) => s + (i.valor || 0), 0);
  const pct      = itens.length ? Math.round(((temos + pedido * 0.5) / itens.length) * 100) : 0;
  document.getElementById("m-pct").textContent       = pct + "%";
  document.getElementById("m-sub").textContent       = `${temos} chegaram · ${pedido} a caminho`;
  document.getElementById("m-gasto").textContent     = fmt(gasto);
  document.getElementById("m-presentes").textContent = fmt(presentes);
  document.getElementById("barra").style.width       = pct + "%";
}

function renderFiltros() {
  document.getElementById("filtros-status").innerHTML = FILTROS_STATUS.map(([s, dot, lbl]) => `
    <button class="filtro-btn ${filtroStatus === s ? "ativo" : ""}" onclick="setFiltroStatus('${s}')">
      ${dot ? `<span class="filtro-dot" style="background:${dot}"></span>` : ""}${lbl}
    </button>`).join("");

  document.getElementById("filtros-cat").innerHTML =
    ["Todas", ...Object.keys(CATEGORIAS)].map(c => `
      <button class="filtro-btn ${catAtiva === c ? "ativo" : ""}" onclick="setCat('${c.replace(/'/g,"\\'")}')">
        ${c !== "Todas" ? CATEGORIAS[c].emoji + " " + c : "Todas"}
      </button>`).join("");
}

function renderLista() {
  const filtrados = itens
    .filter(i => (catAtiva === "Todas" || i.cat === catAtiva) && (filtroStatus === "Todos" || i.status === filtroStatus))
    .sort((a, b) => {
      if (catAtiva !== "Todas") return 0;
      return ({ falta: 0, pedido: 1, temos: 2 }[a.status] || 0) - ({ falta: 0, pedido: 1, temos: 2 }[b.status] || 0);
    });

  if (!filtrados.length) {
    document.getElementById("lista").innerHTML = `<p style="color:#5a7a70;font-size:14px;padding:1rem 0">Nenhum item encontrado.</p>`;
    return;
  }

  document.getElementById("lista").innerHTML = filtrados.map((item, idx) => {
    const cat = CATEGORIAS[item.cat] || { emoji: "📦", cor: "#F1EFE8", corText: "#444441" };
    const ultimo = idx === filtrados.length - 1;
    const editando = editandoId === item.id;
    const statusBtns = Object.entries(STATUS).map(([k, v]) => `
      <button class="status-btn" onclick="setStatus('${item.id}','${k}')" style="
        border: 1.5px solid ${v.borda};
        background: ${item.status === k ? v.bg : "transparent"};
        color: ${item.status === k ? v.textoCor : v.borda};
        font-weight: ${item.status === k ? 500 : 400};">
        ${v.label}
      </button>`).join("");

    const prazoStr = item.status === "pedido"
      ? `<span class="item-tag" style="background:#FEF3C7;color:#633806">🚚 ${item.prazoEntrega ? "Entrega: " + new Date(item.prazoEntrega + "T12:00:00").toLocaleDateString("pt-BR") : "Sem prazo"}</span>`
      : "";
    const presenteStr = item.presente
      ? `<span class="item-tag" style="background:#FBEAF0;color:#72243E">Presente${item.presenteDe ? " de " + item.presenteDe : ""}</span>`
      : "";
    const quemStr = item.adicionadoPor
      ? `<span style="font-size:12px;color:#5a7a70">✍️ ${item.adicionadoPor} · ${item.adicionadoEm || ""}</span>`
      : "";
    const valorStr = item.valor > 0 ? `<span style="font-size:13px;color:#5a7a70">${fmt(item.valor)}</span>` : "";

    const editBox = editando ? `
      <div class="edit-box" id="edit-${item.id}">
        <div><label>Quantidade</label><input type="number" min="1" value="${item.qty || 1}" onchange="atualizar('${item.id}','qty',+this.value)"></div>
        <div><label>Valor (R$)</label><input type="number" min="0" step="0.01" value="${item.valor || 0}" onchange="atualizar('${item.id}','valor',+this.value)"></div>
        ${item.status === "pedido" ? `
        <div class="edit-full">
          <label>Prazo de entrega</label>
          <input type="date" value="${item.prazoEntrega || ""}" onchange="atualizar('${item.id}','prazoEntrega',this.value)">
        </div>` : ""}
        <div class="edit-full" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:#5a7a70;margin:0">
            <input type="checkbox" ${item.presente ? "checked" : ""} onchange="toggleBool('${item.id}','presente',${item.presente})"> É presente?
          </label>
          <input id="pd-${item.id}" placeholder="De quem?" value="${item.presenteDe || ""}" style="display:${item.presente ? "block" : "none"};flex:1;min-width:120px;padding:6px 10px;border-radius:8px;border:0.5px solid #c5d9d0;font-size:14px;font-family:inherit;" onchange="atualizar('${item.id}','presenteDe',this.value)">
        </div>
        <button class="btn-salvar" onclick="fecharEdit()">Salvar</button>
      </div>` : "";

    return `
      <div>
        <div class="item-row">
          <div class="status-btns">${statusBtns}</div>
          <div class="item-info">
            <p class="item-nome ${item.status !== "falta" ? "riscado" : ""}">${item.nome}</p>
            <div class="item-tags">
              <span style="font-size:13px;color:#5a7a70">Qtd: ${item.qty || 1}</span>
              ${valorStr}${prazoStr}${presenteStr}${quemStr}
              <span class="item-tag" style="background:${cat.cor};color:${cat.corText}">${cat.emoji} ${item.cat}</span>
            </div>
          </div>
          <div class="item-acoes">
            <button class="btn-acao" onclick="toggleEdit('${item.id}')">✏️</button>
            <button class="btn-acao" onclick="remover('${item.id}')">🗑️</button>
          </div>
        </div>
        ${editBox}
        ${!ultimo ? '<div class="item-sep"></div>' : ""}
      </div>`;
  }).join("");
}

function popularCats() {
  const sel = document.getElementById("add-cat");
  if (sel) sel.innerHTML = Object.keys(CATEGORIAS).map(c => `<option>${c}</option>`).join("");
}

// ── AÇÕES ─────────────────────────────────
window.setFiltroStatus = s => { filtroStatus = s; renderTudo(); };
window.setCat          = c => { catAtiva = c; renderTudo(); };
window.toggleEdit      = id => { editandoId = editandoId === id ? null : id; renderLista(); };
window.fecharEdit      = () => { editandoId = null; renderLista(); };
window.setStatus       = (id, s) => updateDoc(doc(db, "itens", id), { status: s });
window.atualizar       = (id, campo, val) => updateDoc(doc(db, "itens", id), { [campo]: val });
window.toggleBool      = (id, campo, val) => { updateDoc(doc(db, "itens", id), { [campo]: !val }); };
window.remover         = id => { if (confirm("Remover este item?")) deleteDoc(doc(db, "itens", id)); };

window.abrirAdd  = () => {
  popularCats();
  document.getElementById("add-box").style.display = "flex";
  document.getElementById("btn-add").style.display = "none";
};
window.fecharAdd = () => { document.getElementById("add-box").style.display = "none"; document.getElementById("btn-add").style.display = "block"; };
window.toggleAddPrazo     = () => { document.getElementById("add-prazo-wrap").style.display = document.getElementById("add-status").value === "pedido" ? "block" : "none"; };
window.toggleAddPresenteDe= () => { document.getElementById("add-presenteDe").style.display = document.getElementById("add-presente").checked ? "block" : "none"; };

window.confirmarAdd = () => {
  const nome = document.getElementById("add-nome").value.trim();
  if (!nome) return;
  addDoc(collection(db, "itens"), {
    nome,
    cat:          document.getElementById("add-cat").value,
    status:       document.getElementById("add-status").value,
    prazoEntrega: document.getElementById("add-prazo").value || "",
    qty:          +document.getElementById("add-qty").value,
    valor:        +document.getElementById("add-valor").value,
    presente:     document.getElementById("add-presente").checked,
    presenteDe:   document.getElementById("add-presenteDe").value,
    adicionadoPor: userNome,
    adicionadoEm:  new Date().toLocaleDateString("pt-BR"),
  });
  document.getElementById("add-nome").value = "";
  document.getElementById("add-qty").value = "1";
  document.getElementById("add-valor").value = "0";
  document.getElementById("add-status").value = "falta";
  document.getElementById("add-prazo").value = "";
  document.getElementById("add-prazo-wrap").style.display = "none";
  document.getElementById("add-presente").checked = false;
  document.getElementById("add-presenteDe").style.display = "none";
  document.getElementById("add-presenteDe").value = "";
  fecharAdd();
};
</script>
