  .btn-google {

    background: #1D9E75; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer;

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.75rem; }
  .header-left p  { font-size: 13px; color: #5a7a70; margin-bottom: 2px; }
  .header-left h1 { font-size: 22px; font-weight: 500; color: #085041; }
  .header-right   { display: flex; align-items: center; gap: 8px; }
  .header-right img { width: 32px; height: 32px; border-radius: 50%; }
  .btn-sair {
    background: none; border: 0.5px solid #c5d9d0; border-radius: 8px;
    padding: 4px 10px; font-size: 12px; color: #5a7a70; cursor: pointer;
  }

  /* Métricas */
  .metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  .metrica  { background: #fff; border-radius: 10px; padding: 12px 14px; border: 0.5px solid #d0e8df; }
  .metrica .label { font-size: 11px; color: #5a7a70; margin-bottom: 6px; }
  .metrica .val   { font-size: 17px; font-weight: 500; color: #085041; margin-bottom: 2px; }
  .metrica .sub   { font-size: 11px; color: #5a7a70; }

  /* Barra */
  .barra-wrap { height: 6px; border-radius: 99px; background: #d0e8df; overflow: hidden; margin-bottom: 1.75rem; }
  .barra-fill { height: 100%; background: #1D9E75; border-radius: 99px; transition: width 0.4s ease; }

  /* Filtros */
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 1.25rem; }
  .filtro-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 99px; font-size: 12px; cursor: pointer;
    background: transparent; color: #5a7a70; border: 0.5px solid #c5d9d0;
    font-family: inherit;
  }
  .filtro-btn.ativo { background: #fff; color: #085041; border-color: #1D9E75; font-weight: 500; }
  .filtro-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .filtro-sep { width: 0.5px; height: 18px; background: #c5d9d0; margin: 0 2px; }

  /* Lista */
  .lista { display: flex; flex-direction: column; }
  .item-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .item-sep  { height: 0.5px; background: #d0e8df; }

  .status-btn {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #E24B4A; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .status-btn.temos { border-color: #1D9E75; background: #1D9E75; }
  .status-btn.temos::after { content: "✓"; color: #fff; font-size: 12px; font-weight: 700; }

  .item-info { flex: 1; min-width: 0; }
  .item-nome { font-size: 14px; font-weight: 500; color: #1a1a1a; }
  .item-nome.riscado { color: #5a7a70; text-decoration: line-through; }
  .item-tags { display: flex; gap: 8px; margin-top: 3px; flex-wrap: wrap; align-items: center; }
  .item-tag  { font-size: 11px; padding: 1px 8px; border-radius: 99px; }
  .tag-presente { background: #FBEAF0; color: #72243E; }

  .item-acoes { display: flex; gap: 2px; flex-shrink: 0; }
  .btn-acao { background: none; border: none; cursor: pointer; font-size: 14px; padding: 4px 6px; }

  /* Edição inline */
  .edit-box {
    margin-bottom: 8px; padding: 14px; background: #fff;
    border: 0.5px solid #d0e8df; border-radius: 10px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .edit-box label { font-size: 12px; color: #5a7a70; display: block; margin-bottom: 4px; }
  .edit-box input, .edit-box select {
    padding: 6px 10px; border-radius: 8px; border: 0.5px solid #c5d9d0;
    background: #fff; color: #1a1a1a; font-size: 14px; width: 100%;
    font-family: inherit;

  .edit-box .full { grid-column: 1 / -1; }
  .edit-box .presente-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .edit-box .presente-row label { margin: 0; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .btn-salvar {

    width: 100%; padding: 10px 0; border-radius: 10px;
    border: 0.5px dashed #a0c4b8; background: transparent;

  .add-box {

  .add-box .grid2b { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .add-box label { font-size: 12px; color: #5a7a70; display: block; margin-bottom: 4px; }

    background: #1D9E75; color: #fff; font-weight: 500; font-size: 14px;

  .btn-cancelar {
    padding: 9px 16px; border-radius: 8px; border: 0.5px solid #c5d9d0;
    background: transparent; color: #5a7a70; font-size: 14px; cursor: pointer;
    font-family: inherit;
  }

  .rodape { text-align: center; font-size: 12px; color: #5a7a70; margin-top: 1.5rem; }

  #app { display: none; }

  { cat: "Roupinhas",            nome: "Tênis regular - 6-12M",                                       qty: 2,  valor: 0, status: "temos", presente: false, presenteDe: "" },
  { cat: "Roupinhas",            nome: "Sapatilha para bebê - 6-12M",                                 qty: 4,  valor: 0, status: "temos", presente: false, presenteDe: "" },
  { cat: "Passeio & Transporte", nome: "Carrinho de bebê",                                            qty: 1,  valor: 0, status: "temos", presente: false, presenteDe: "" },
  { cat: "Passeio & Transporte", nome: "Cadeirinha de carro infantil - 6-12M",                        qty: 2,  valor: 0, status: "temos", presente: false, presenteDe: "" },
  { cat: "Passeio & Transporte", nome: "Acessório para carrinho (1)",                                 qty: 1,  valor: 0, status: "temos", presente: false, presenteDe: "" },
  { cat: "Passeio & Transporte", nome: "Acessório para carrinho (2)",                                 qty: 1,  valor: 0, status: "temos", presente: false, presenteDe: "" },
  { cat: "Passeio & Transporte", nome: "Bolsa de fraldas",                                            qty: 1,  valor: 0, status: "temos", presente: false, presenteDe: "" },
];

const fmt = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

let catAtiva = "Todas";
let filtroStatus = "Todos";
let editandoId = null;
let itens = [];

// ── AUTH ──────────────────────────────────────
window.fazerLogin = () => signInWithPopup(auth, provider);
window.fazerLogout = () => signOut(auth);

onAuthStateChanged(auth, u => {
  if (u && EMAILS_PERMITIDOS.includes(u.email)) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("user-foto").src = u.photoURL;
    document.getElementById("erro-login").style.display = "none";
    iniciarFirestore();
  } else if (u) {
    signOut(auth);
    document.getElementById("erro-login").style.display = "block";
  } else {
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});

// ── FIRESTORE ────────────────────────────────
function iniciarFirestore() {
  onSnapshot(collection(db, "itens"), snap => {
    const dados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (dados.length === 0) {
      ITENS_INICIAIS.forEach(it => addDoc(collection(db, "itens"), it));
    } else {
      itens = dados;
      renderTudo();
    }
  });
}

// ── RENDER ───────────────────────────────────
function renderTudo() {
  renderFiltros();
  renderLista();
  renderMetricas();
  popularSelectCat("add-cat", "Roupinhas");
}

function renderMetricas() {
  const temos     = itens.filter(i => i.status === "temos");
  const pct       = itens.length ? Math.round(temos.length / itens.length * 100) : 0;
  const gasto     = temos.filter(i => !i.presente).reduce((s, i) => s + (i.valor || 0), 0);
  const presentes = temos.filter(i => i.presente).reduce((s, i) => s + (i.valor || 0), 0);
  document.getElementById("m-pct").textContent      = pct + "%";
  document.getElementById("m-sub").textContent      = `${temos.length} de ${itens.length} itens`;
  document.getElementById("m-gasto").textContent    = fmt(gasto);
  document.getElementById("m-presentes").textContent= fmt(presentes);
  document.getElementById("barra").style.width      = pct + "%";
}

function renderFiltros() {
  const el = document.getElementById("filtros");
  const statusOpts = [["Todos", null], ["falta", "#E24B4A"], ["temos", "#1D9E75"]];
  const statusLabels = { falta: "Falta comprar", temos: "Já temos" };
  let html = statusOpts.map(([s, dot]) => `
    <button class="filtro-btn ${filtroStatus === s ? "ativo" : ""}" onclick="setFiltroStatus('${s}')">
      ${dot ? `<span class="filtro-dot" style="background:${dot}"></span>` : ""}
      ${s === "Todos" ? "Todos" : statusLabels[s]}
    </button>`).join("");
  html += `<div class="filtro-sep"></div>`;
  html += `<button class="filtro-btn ${catAtiva === "Todas" ? "ativo" : ""}" onclick="setCat('Todas')">Todas</button>`;
  html += Object.entries(CATEGORIAS).map(([c, v]) => `
    <button class="filtro-btn ${catAtiva === c ? "ativo" : ""}" onclick="setCat('${c}')">
      ${v.emoji} ${c}
    </button>`).join("");
  el.innerHTML = html;
}

function renderLista() {
  const filtrados = itens
    .filter(i => (catAtiva === "Todas" || i.cat === catAtiva) && (filtroStatus === "Todos" || i.status === filtroStatus))
    .sort((a, b) => catAtiva !== "Todas" ? 0 : a.status === b.status ? 0 : a.status === "falta" ? -1 : 1);

  const el = document.getElementById("lista");
  if (!filtrados.length) { el.innerHTML = `<p style="color:#5a7a70;font-size:14px;padding:1rem 0">Nenhum item encontrado.</p>`; return; }

  el.innerHTML = filtrados.map((item, idx) => {
    const cat = CATEGORIAS[item.cat];
    const resolvido = item.status === "temos";
    const ultimo = idx === filtrados.length - 1;
    const editando = editandoId === item.id;
    return `
      <div>
        <div class="item-row">
          <button class="status-btn ${resolvido ? "temos" : ""}" onclick="toggleStatus('${item.id}','${item.status}')"></button>
          <div class="item-info">
            <div class="item-nome ${resolvido ? "riscado" : ""}">${item.nome}</div>
            <div class="item-tags">
              <span style="font-size:12px;color:#5a7a70">Qtd: ${item.qty}</span>
              ${item.valor > 0 ? `<span style="font-size:12px;color:#5a7a70">${fmt(item.valor)}</span>` : ""}
              ${item.presente ? `<span class="item-tag tag-presente">Presente${item.presenteDe ? " de " + item.presenteDe : ""}</span>` : ""}
              <span class="item-tag" style="background:${cat.cor};color:${cat.corText}">${cat.emoji} ${item.cat}</span>
            </div>
          </div>
          <div class="item-acoes">
            <button class="btn-acao" onclick="toggleEdit('${item.id}')">✏️</button>
            <button class="btn-acao" onclick="removerItem('${item.id}')">🗑️</button>
          </div>
        </div>
        ${editando ? renderEdit(item) : ""}
        ${!ultimo ? `<div class="item-sep"></div>` : ""}
      </div>`;
  }).join("");
}

function renderEdit(item) {
  const cats = Object.keys(CATEGORIAS).map(c => `<option ${item.cat === c ? "selected" : ""}>${c}</option>`).join("");
  return `
    <div class="edit-box" id="edit-${item.id}">
      <div><label>Quantidade</label><input type="number" min="1" value="${item.qty}" onchange="atualizar('${item.id}','qty',+this.value)"></div>
      <div><label>Valor (R$)</label><input type="number" min="0" step="0.01" value="${item.valor||0}" onchange="atualizar('${item.id}','valor',+this.value)"></div>
      <div class="full">
        <div class="presente-row">
          <label><input type="checkbox" ${item.presente ? "checked" : ""} onchange="toggleBool('${item.id}','presente',${item.presente})"> É presente?</label>
          <input id="pd-${item.id}" placeholder="De quem?" value="${item.presenteDe||''}" style="display:${item.presente ? "block" : "none"};flex:1;min-width:120px;padding:6px 10px;border-radius:8px;border:0.5px solid #c5d9d0;font-size:14px;font-family:inherit;" onchange="atualizar('${item.id}','presenteDe',this.value)">
        </div>
      </div>
      <button class="btn-salvar" onclick="toggleEdit('${item.id}')">Salvar</button>
    </div>`;
}

function popularSelectCat(id, defaultCat) {
  const sel = document.getElementById(id);
  if (!sel) return;
  sel.innerHTML = Object.keys(CATEGORIAS).map(c => `<option ${c === defaultCat ? "selected" : ""}>${c}</option>`).join("");
}

// ── AÇÕES ────────────────────────────────────
window.setFiltroStatus = s => { filtroStatus = s; renderTudo(); };
window.setCat          = c => { catAtiva = c; renderTudo(); };
window.toggleEdit      = id => { editandoId = editandoId === id ? null : id; renderLista(); };
window.toggleStatus    = (id, status) => updateDoc(doc(db, "itens", id), { status: status === "falta" ? "temos" : "falta" });
window.atualizar       = (id, campo, val) => updateDoc(doc(db, "itens", id), { [campo]: val });
window.toggleBool      = (id, campo, val) => updateDoc(doc(db, "itens", id), { [campo]: !val });
window.removerItem     = id => { deleteDoc(doc(db, "itens", id)); if (editandoId === id) editandoId = null; };

// Adicionar
window.abrirAdicionar  = () => { document.getElementById("add-box").style.display = "flex"; document.getElementById("btn-adicionar") && (document.querySelector(".btn-adicionar").style.display = "none"); };
window.fecharAdicionar = () => { document.getElementById("add-box").style.display = "none"; document.querySelector(".btn-adicionar").style.display = "block"; };
window.toggleAddPresente = () => {
  const checked = document.getElementById("add-presente").checked;
  document.getElementById("add-presenteDe").style.display = checked ? "block" : "none";
};
window.confirmarAdicionar = () => {
  const nome = document.getElementById("add-nome").value.trim();
  if (!nome) return;
  addDoc(collection(db, "itens"), {
    nome, status: "falta",
    cat:       document.getElementById("add-cat").value,
    qty:       +document.getElementById("add-qty").value,
    valor:     +document.getElementById("add-valor").value,
    presente:  document.getElementById("add-presente").checked,
    presenteDe:document.getElementById("add-presenteDe").value,
  });
  document.getElementById("add-nome").value = "";
  document.getElementById("add-qty").value = "1";
  document.getElementById("add-valor").value = "0";
  document.getElementById("add-presente").checked = false;
  document.getElementById("add-presenteDe").style.display = "none";
  document.getElementById("add-presenteDe").value = "";
  fecharAdicionar();
};
</script>
</body>
</html>
